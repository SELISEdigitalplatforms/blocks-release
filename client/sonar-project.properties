# Read by the SonarQube scanner from this directory (projectBaseDir in
# .github/workflows/sonarqube-client.yml); the workflow's -D arguments are applied on top.

# css:S4662 (unknown at-rule) does not know Tailwind CSS v4's directives - @plugin, @source,
# @utility, @custom-variant, @theme - so every one of them is reported as a bug. They are
# processed by @tailwindcss/vite at build time and never reach the browser.
sonar.issue.ignore.multicriteria=tailwindAtRules
sonar.issue.ignore.multicriteria.tailwindAtRules.ruleKey=css:S4662
sonar.issue.ignore.multicriteria.tailwindAtRules.resourceKey=app/styles/**/*.css
